<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgeGuard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--ink:#e8edf7;--mute:#8a94a8;--line:rgba(255,255,255,.08);--glass:rgba(255,255,255,.04);--blue:#8fa8e8;--bad:#ef6a62;--ok:#6fb2ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;padding:32px 20px;
 background:radial-gradient(ellipse 60% 45% at 62% 18%,rgba(40,90,200,.55),transparent 70%),radial-gradient(ellipse 50% 40% at 50% 100%,rgba(70,50,170,.45),transparent 70%),#05070d}
.shell{max-width:1060px;margin:auto;position:relative;border:1px solid var(--line);border-radius:18px;background:rgba(12,15,24,.78);backdrop-filter:blur(14px);padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:12px}
nav{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;margin-bottom:14px}
.logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#dfe6f5,#6c7a99)}
.tabs{display:flex;gap:6px}.tabs span{padding:7px 14px;border-radius:8px;color:var(--mute);font-size:13px}.tabs .on{background:rgba(255,255,255,.09);color:var(--ink)}
.right{display:flex;align-items:center;gap:12px;color:var(--mute)}
.bell{position:relative}.bell b{position:absolute;top:-6px;right:-8px;background:var(--bad);color:#fff;font-size:9px;border-radius:8px;padding:1px 4px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:#56607e;display:grid;place-items:center;font-size:11px;color:#fff}
.layout{display:grid;grid-template-columns:230px 1fr;gap:14px}
aside{padding:14px}
aside h4{margin:0 0 10px;font-weight:500;font-size:14px;display:flex;justify-content:space-between}
aside h4 small{background:rgba(255,255,255,.1);border-radius:6px;padding:0 6px;font-size:11px;color:var(--mute);margin-inline-start:6px}
.sens{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;font-size:13px}
.sens i{width:14px;height:14px;border:1.5px solid var(--mute);border-radius:4px;flex:none;position:relative}
.sens i.ok{border-color:var(--ok);background:rgba(111,178,255,.25)}
.sens i.bad{border-color:var(--bad);background:rgba(239,106,98,.3)}
.sens em{margin-left:auto;font-style:normal;color:var(--mute);font-size:12px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.act{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:12.5px}
.act i{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.07);flex:none}
.act small{display:block;color:var(--mute);font-size:11px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa div{padding:12px 4px;text-align:center;font-size:11px;color:var(--mute)}
.qa b{display:block;font-size:18px;color:var(--ink);font-weight:600}
.head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.head h2{margin:0;font-size:19px;font-weight:600}
.btn{padding:7px 14px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:rgba(255,255,255,.03)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.stat{padding:12px 14px;height:130px;position:relative}
.stat span{font-size:12px;color:var(--mute)}
.stat b{display:block;font-size:22px;font-weight:600;margin:2px 0}
.stat canvas{position:absolute;left:8px;right:8px;bottom:6px;height:60px!important;width:calc(100% - 16px)!important}
.donut{position:absolute;right:14px;bottom:10px}
.mile{padding:14px 16px;margin-bottom:12px}
.mile .row{display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;gap:3px;margin:12px 0 6px}.seg div{flex:1;height:6px;border-radius:3px;background:var(--blue)}.seg div.bad{background:var(--bad)}
.mile small{color:var(--mute);font-size:12px}
.big{padding:14px 16px;height:250px;position:relative}
.big>div{height:200px;position:relative}
.float{position:absolute;right:-14px;bottom:-26px;width:250px;padding:14px;background:rgba(40,46,66,.72);backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.float h4{margin:0 0 10px;font-weight:500}
.al{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;font-size:12.5px;background:rgba(255,255,255,.04)}
.al small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.al.none{color:var(--mute)}
#conn{color:var(--mute);font-size:12px}
@media(max-width:860px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.float{position:static;width:auto;margin-top:12px}.tabs span:nth-child(n+3){display:none}}
</style>
</head>
<body>
<div class="shell">
  <nav class="glass">
    <div class="logo"></div>
    <div class="tabs"><span class="on" style="font-weight:600;letter-spacing:.3px">EdgeGuard &mdash; IoT Telemetry Monitor</span></div>
    <div class="right"><span id="conn">connecting...</span><span class="bell">&#128276;<b id="bellN">0</b></span></div>
  </nav>

  <div class="layout">
    <aside class="glass">
      <h4>Sensors <span><small id="sc">5</small></span></h4>
      <div id="sens"></div>
      <hr>
      <h4>Recent Activity</h4>
      <div id="recent"></div>
      <hr>
      <h4>Quick Access</h4>
      <div class="qa"><div class="glass"><b id="qs">0</b>Sent</div><div class="glass"><b id="qb">0</b>Blocked</div><div class="glass"><b id="qt">0</b>Total</div></div>
    </aside>

    <main>
      <div class="head"><h2>System Overview</h2><div class="btn">esp32-lab-01 &#9679; online</div></div>
      <div class="stats">
        <div class="glass stat"><span>Temperature</span><b id="vt">-</b><canvas id="cT"></canvas></div>
        <div class="glass stat"><span>Voltage</span><b id="vv">-</b><canvas id="cV"></canvas></div>
        <div class="glass stat"><span>Normal readings</span><b id="vp">-</b>
          <svg class="donut" width="78" height="78" viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/><circle id="ring" cx="40" cy="40" r="32" fill="none" stroke="#9db4ec" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 201" transform="rotate(-90 40 40)"/><text id="rt" x="40" y="44" text-anchor="middle" fill="#e8edf7" font-size="13">-</text></svg>
        </div>
      </div>

      <div class="glass mile">
        <div class="row"><b style="font-weight:500">Detection Timeline</b><span id="pct" style="color:var(--mute)">-</span></div>
        <small id="mt">last 30 readings</small>
        <div class="seg" id="seg"></div>
        <div class="row"><small>older</small><small>latest</small></div>
      </div>

      <div class="glass big"><b style="font-weight:500">Current &amp; Power</b><div><canvas id="cB"></canvas></div></div>
    </main>
  </div>

  <div class="glass float">
    <h4>Latest Alerts</h4>
    <div id="alerts"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, query, limitToLast, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
// your firebase config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID"
};

const db = getDatabase(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const SENS = [["temperature","Temperature","°C"],["humidity","Humidity","%"],["voltage","Voltage","V"],["current","Current","A"],["power","Power","W"]];
const fmt = ts => new Date(ts).toLocaleTimeString("en-GB");
const ago = ts => { const s = Math.max(0, (Date.now() - ts) / 1000 | 0); return s < 60 ? s + "s ago" : s < 3600 ? (s / 60 | 0) + " min ago" : (s / 3600 | 0) + " h ago"; };
const why = r => [r.too_many_requests && "Too many requests", r.out_of_range && "Reading out of range"].filter(Boolean).join(" + ") || (r.type ? String(r.type).replace(/_/g, " ").toLowerCase() : "Alert");

Chart.defaults.color = "#8a94a8";
Chart.defaults.font.family = "Inter, system-ui, sans-serif";
const grad = (ctx, c) => { const g = ctx.createLinearGradient(0, 0, 0, 260); g.addColorStop(0, c + "88"); g.addColorStop(1, c + "05"); return g; };
const base = (extra = {}) => ({ responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, ...extra });
const mini = { x: { display: false }, y: { display: false } };

const cT = new Chart($("cT"), { type: "line", data: { labels: [], datasets: [{ data: [], borderColor: "#9db4ec", borderWidth: 2, pointRadius: 0, tension: .35, fill: true, backgroundColor: c => grad(c.chart.ctx, "#6f8de0") }] }, options: base({ scales: mini }) });
const cV = new Chart($("cV"), { type: "bar", data: { labels: [], datasets: [{ data: [], backgroundColor: "#8fa8e8", borderRadius: 3, barPercentage: .5 }] }, options: base({ scales: mini }) });
const cB = new Chart($("cB"), { type: "line", data: { labels: [], datasets: [
  { label: "power (W)", data: [], borderColor: "#9db4ec", borderWidth: 2, pointRadius: 0, tension: .35, fill: true, backgroundColor: c => grad(c.chart.ctx, "#6f8de0") },
  { label: "current (A)", data: [], borderColor: "#ef6a62", borderWidth: 2, pointRadius: 0, tension: .35, yAxisID: "y2" }] },
  options: base({ plugins: { legend: { display: true, labels: { boxWidth: 10 } } }, scales: {
    x: { grid: { display: false }, ticks: { maxTicksLimit: 7 } },
    y: { position: "left", beginAtZero: true, grid: { color: "rgba(255,255,255,.06)" }, ticks: { color: "#9db4ec" }, title: { display: true, text: "W", color: "#9db4ec" } },
    y2: { position: "left", beginAtZero: true, grid: { drawOnChartArea: false }, ticks: { color: "#ef6a62", stepSize: 0.005, maxTicksLimit: 40, font: { size: 9 } }, title: { display: true, text: "A", color: "#ef6a62" } } } }) });

let readings = [], alertsHist = [], alertLatest = [];
const toList = v => { v = v || {}; return v.ts !== undefined ? [v] : Object.values(v).filter(x => x && typeof x === "object" && x.ts !== undefined); };

function render(){
  const now = readings.filter(r => r.status !== "BLOCKED").sort((a, b) => a.ts - b.ts);   // قراءات سليمة بس
  const seen = new Set(), alerts = [...alertsHist, ...alertLatest].filter(a => !seen.has(a.ts) && seen.add(a.ts)).sort((a, b) => a.ts - b.ts);
  const sent = now.length, total = sent + alerts.length;
  if (!total) return;
  const last = now[now.length - 1], lastAlert = alerts[alerts.length - 1];
  const bad = !!lastAlert && (!last || lastAlert.ts > last.ts);

  $("sens").innerHTML = SENS.map(([k, n, u]) => `<div class="sens"><i class="${bad ? "bad" : "ok"}"></i>${n}<em>${last ? last[k] : "-"} ${u}</em></div>`).join("");

  const events = [...now.map(r => ({ ts: r.ts, bad: false })), ...alerts.map(a => ({ ts: a.ts, bad: true, why: why(a) }))].sort((a, b) => a.ts - b.ts);
  $("recent").innerHTML = events.slice(-3).reverse().map(e => `<div class="act"><i></i><div>${e.bad ? "Alert: " + e.why : "Reading sent"}<small>${ago(e.ts)}</small></div></div>`).join("");
  $("qs").textContent = sent; $("qb").textContent = alerts.length; $("qt").textContent = total;
  $("bellN").textContent = alerts.length;

  if (last) { $("vt").textContent = last.temperature + " °C"; $("vv").textContent = last.voltage + " V"; }
  const pct = Math.round(sent / total * 100);
  $("vp").textContent = pct + "%"; $("rt").textContent = pct + "%";
  $("ring").setAttribute("stroke-dasharray", `${pct * 2.01} 201`);

  const tail = events.slice(-30);
  $("seg").innerHTML = tail.map(e => `<div class="${e.bad ? "bad" : ""}" title="${fmt(e.ts)}"></div>`).join("");
  const tb = tail.filter(e => e.bad).length;
  $("pct").textContent = Math.round((tail.length - tb) / tail.length * 100) + "%";
  $("mt").textContent = bad ? "Alert: " + why(lastAlert) + " (sensor data withheld)" : "All recent readings look normal";

  const labels = now.map(r => fmt(r.ts));
  cT.data.labels = labels; cT.data.datasets[0].data = now.map(r => r.temperature); cT.update();
  const v6 = now.slice(-6); cV.data.labels = v6.map(r => fmt(r.ts)); cV.data.datasets[0].data = v6.map(r => r.voltage); cV.update();
  cB.data.labels = labels; cB.data.datasets[0].data = now.map(r => r.power); cB.data.datasets[1].data = now.map(r => r.current); cB.update();

  $("alerts").innerHTML = alerts.length
    ? alerts.slice(-2).reverse().map(a => `<div class="al">${why(a)}<small>${fmt(a.ts)} - sensor data withheld</small></div>`).join("")
    : `<div class="al none">No alerts yet</div>`;
}

const fail = err => { $("conn").textContent = "error: " + err.message; };
onValue(query(ref(db, "readings"), limitToLast(120)), snap => { $("conn").textContent = "connected"; readings = toList(snap.val()); render(); }, fail);
onValue(query(ref(db, "alerts"), limitToLast(100)), snap => { alertsHist = toList(snap.val()); render(); }, fail);
onValue(ref(db, "latest_alert"), snap => { alertLatest = toList(snap.val()); render(); }, fail);
</script>
</body>
</html>
