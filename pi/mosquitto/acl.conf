# EdgeGuard v5 topics (taken from the real code):
#   edgeguard/v1/telemetry            ESP32 -> broker -> gateway
#   edgeguard/v1/status/<DEVICE_ID>   ESP32 (online + Last Will offline) -> gateway
#   edgeguard/v1/events               gateway -> broker
# Mosquitto username == DEVICE_ID, so each ESP32 can only write its own status topic.

# ---------- Raspberry Pi gateway ----------
user gateway
topic read  edgeguard/v1/telemetry
topic read  edgeguard/v1/status/+
topic write edgeguard/v1/events

# ---------- ESP32 #1  (DEVICE_ID = esp32-lab-01) ----------
user esp32-lab-01
topic write edgeguard/v1/telemetry
topic write edgeguard/v1/status/esp32-lab-01

# ---------- Add one block per extra device (copy, rename) ----------
# user esp32-lab-02
# topic write edgeguard/v1/telemetry
# topic write edgeguard/v1/status/esp32-lab-02